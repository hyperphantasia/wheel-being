# Workflow: Deploy to GitHub Pages and create releases on version tags
# Triggered on: pushes to main branch, version tags (v*), or manual dispatch
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]        # Deploy to Pages on main branch pushes
    tags: ["v*"]              # Create releases on version tags (v1.0.0, etc.)
  workflow_dispatch:          # Allow manual workflow triggers

# Deny by default. Each job opts in to only the scopes it needs.
permissions: {}

# Don't cancel an in-progress run mid-deploy or mid-release. 
# That can leave GitHub Pages or a release half-published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Compile the project and prepare artifacts. Untrusted code runs here
  # (npm install scripts, the build itself) so this job gets read-only
  # permissions: no contents:write, no pages:write, no id-token:write.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css _site/css
          cp -r data _site/data
          cp -r dist _site/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd _site
          zip -r ../wheel-being.zip .
          cd ..

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive
          path: wheel-being.zip
          retention-days: 1

  # Publishes the GitHub Release. Only this job holds contents: write, and
  # it never runs npm/arbitrary build tooling, it just downloads the
  # artifact build already produced and attaches it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: wheel-being.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Conditional deployment. Only from main, not from tags.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
