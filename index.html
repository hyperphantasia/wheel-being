<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      La Roue du bien-être: bonheur et bien-être en Europe (2004-2024)
    </title>
    <meta
      name="description"
      content="Visualisation radiale interactive comparant le bonheur, le bien-être subjectif et dix indicateurs socio-économiques dans 16 pays européens entre 2004 et 2024."
    />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070b" />

    <!-- Open Graph / Twitter card: update the og:url before deploying. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="La roue du bien-être: bonheur et bien-être en Europe"
    />
    <meta
      property="og:description"
      content="Explorez le bonheur, le bien-être perçu et dix indicateurs socio-économiques dans 16 pays européens (2004-2024) à travers une roue radiale interactive. Compétition de data-visualisation."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="La Roue du Bien-être" />
    <meta
      name="twitter:description"
      content="Une visualisation radiale interactive du bien-être en Europe, 2004-2024."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%230f1724' stroke='%237dd3fc' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%237dd3fc'/%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://d3js.org" />
    <script src="https://d3js.org/d3.v7.min.js" defer></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "La Roue du bien-être",
        "description": "Visualisation radiale interactive du bien-être en Europe (2004-2024), combinant un indice de bonheur agrégé et le bien-être subjectif perçu pour 16 pays.",
        "applicationCategory": "DataVisualization",
        "inLanguage": "fr",
        "isAccessibleForFree": true
      }
    </script>
  </head>

  <body>
    <noscript>
      <p
        style="
          max-width: 640px;
          margin: 40px auto;
          padding: 20px;
          font-family: sans-serif;
          color: #ecf2fb;
          background: #0f1724;
        "
      >
        Cette visualisation nécessite JavaScript pour s'afficher. Merci
        d'activer JavaScript dans votre navigateur.
      </p>
    </noscript>

    <div class="wrap">
      <div class="panel">
        <div class="year-controls">
          <button id="prevYear">← Année Préc.</button>
          <button id="nextYear">Année suiv. →</button>
          <button id="playPause" aria-pressed="false">Démarrer</button>
        </div>

        <div class="hero" id="heroBox">
          <div class="hero-top-row">
            <div class="kicker">
              <div class="kicker-left">
                <span class="kicker-dot" aria-hidden="true"></span>
                <span id="stageLabel">La roue du bonheur.</span>
              </div>
              <div class="state-nav-group">
                <button
                  id="prevStage"
                  class="state-btn"
                  aria-label="Story précédente"
                >
                  ←
                </button>
                <button
                  id="nextStage"
                  class="state-btn"
                  aria-label="Story suivante"
                >
                  →
                </button>
              </div>
            </div>
            <h1 id="heroTitle">A story of human wellbeing</h1>
          </div>

          <p class="subcopy" id="heroCopy"></p>

          <div class="cluster-toggle-row" id="clusterToggleRow">
            <span class="toggle-label" id="clusterToggleLabel"
              >Identifier les groupes</span
            >
            <label class="switch">
              <input
                type="checkbox"
                id="clusterToggle"
                role="switch"
                aria-checked="false"
                aria-labelledby="clusterToggleLabel"
              />
              <span class="slider" aria-hidden="true"></span>
            </label>
          </div>

          <div class="cluster-legend" id="clusterLegend"></div>

          <div class="perception-row" id="perceptionToggleRow">
            <span class="toggle-label" id="perceptionToggleLabel"
              >Afficher le bonheur perçu</span
            >
            <label class="switch">
              <input
                type="checkbox"
                id="perceptionToggle"
                role="switch"
                aria-checked="false"
                aria-labelledby="perceptionToggleLabel"
              />
              <span class="slider" aria-hidden="true"></span>
            </label>
          </div>

          <div class="perception-legend" id="perceptionLegend"></div>
          <div class="story-meta" id="heroPills"></div>
        </div>

        <div class="hud" id="hud">
          <div class="hud-head">
            <div class="hud-title" id="hudTitle">Légende</div>
            <button
              class="legend-toggle"
              id="legendToggle"
              aria-expanded="false"
              aria-controls="legendWrap"
              aria-label="Afficher la légende détaillée"
            >
              +
            </button>
          </div>
          <div class="legend-wrap" id="legendWrap">
            <div id="legend" class="legend" aria-labelledby="hudTitle"></div>
          </div>
        </div>

        <div class="tooltip" id="tooltip" role="tooltip"></div>
        <div class="fade-mask" aria-hidden="true"></div>
        <div class="big-word" id="bigWord" aria-hidden="true">EUROPE</div>
        <div class="selected-center" id="selectedCenter" aria-hidden="true">
          <div class="year" id="centerYear"></div>
          <div class="name" id="centerName"></div>
          <div class="score" id="centerScore"></div>
        </div>
      </div>

      <svg
        id="chart"
        viewBox="0 0 1400 1400"
        role="img"
        aria-labelledby="chartTitle chartDesc"
      >
        <title id="chartTitle">Roue radiale du bien-être en Europe</title>
        <desc id="chartDesc">
          Chaque pays est représenté par un secteur dont le rayon indique
          l'indice de bonheur agrégé, composé de dix indicateurs
          socio-économiques empilés. Un tableau accessible équivalent est fourni
          ci-dessous.
        </desc>
      </svg>
    </div>

    <!-- Screen-reader-only equivalent of the current year's data, kept in sync
       with the chart on every render (see js/chart/accessibility.js). -->
    <div id="a11yStatus" class="sr-only" role="status" aria-live="polite"></div>
    <section
      class="sr-only"
      aria-label="Classement du bien-être, version tableau"
    >
      <table id="a11yTable" class="sr-only-table">
        <caption id="a11yTableCaption"></caption>
        <thead>
          <tr>
            <th scope="col">Rang</th>
            <th scope="col">Pays</th>
            <th scope="col">Indice de bonheur</th>
            <th scope="col">Bonheur perçu</th>
          </tr>
        </thead>
        <tbody id="a11yTableBody"></tbody>
      </table>
    </section>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
